name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Verify conformance data
        run: |
          python3 tools/conformance/manifest.py verify
          echo "0157c012042afa9a19f0bff509a433a4bd5ddc5b674de864a41bec453c460691  conformance/manifest.json" | sha256sum -c -
          echo "37c91f8f94e10c73513a9c1deef990ea4deea96d5001ae700d6bf799658d0e32  api-surface/surface.json" | sha256sum -c -
      - name: Verify user documents
        run: |
          echo "95c189b5e7c0f65967d366d6b0060e7f66d9cc5df7158a382f69750e40d1b37d  user-docs/template.json" | sha256sum -c -
          echo "104386e9257a05cf8766e12e43e89fe5ff2328b9601c0a24e421c12e76df29dd  tools/user-docs/check.py" | sha256sum -c -
          python3 tools/user-docs/check.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: make vet
      - name: Run staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - run: make test
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Test semver detection
        run: python3 -m unittest discover -s .github -p 'test_*.py' -v
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      - name: Check workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
      # DynamoDB Local, the Cloud Spanner emulator and the Cloud Bigtable emulator are started in containers by the tests
      # (testcontainers-go); Docker is available on ubuntu-latest. A container that does not start fails the job.
      - name: Run conformance runner
        env:
          CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-report.json
        run: go test -count=1 -v ./internal/conformance/...
      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json
          if-no-files-found: warn
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [lint, test, release-checks, conformance]
    if: always()
    steps:
      - name: Check CI results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RELEASE_CHECKS_RESULT: ${{ needs.release-checks.result }}
          CONFORMANCE_RESULT: ${{ needs.conformance.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" || "$TEST_RESULT" != "success" || "$RELEASE_CHECKS_RESULT" != "success" || "$CONFORMANCE_RESULT" != "success" ]]; then
            echo "CI did not succeed: lint=$LINT_RESULT, test=$TEST_RESULT, release-checks=$RELEASE_CHECKS_RESULT, conformance=$CONFORMANCE_RESULT"
            exit 1
          fi
